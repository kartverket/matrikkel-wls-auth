version: 2
updates:
  # Maintain dependencies for Gradle
  - package-ecosystem: "gradle"
    open-pull-requests-limit: 10
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      'io.arrow-kt':
        patterns:
          - "io.arrow-kt:arrow-*"
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/.github/"
    schedule:
      interval: "weekly"
