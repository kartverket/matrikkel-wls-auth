plugins {
    id 'java-platform'
    id 'maven-publish'
}

dependencies {
    constraints {
        api('com.nimbusds:nimbus-jose-jwt:9.1.5')
        api('com.google.crypto.tink:tink:1.5.0')

        api 'org.bitbucket.b_c:jose4j:0.7.4'

        def arrowVersion = '0.11.0'
        api("io.arrow-kt:arrow-core:$arrowVersion")
        api("io.arrow-kt:arrow-fx:$arrowVersion")
        api("io.arrow-kt:arrow-fx-coroutines:$arrowVersion")
        api("io.arrow-kt:arrow-optics:$arrowVersion")
        api("io.arrow-kt:arrow-syntax:$arrowVersion")
        api("io.arrow-kt:arrow-meta:$arrowVersion")

        api('org.apache.logging.log4j:log4j-api:2.14.0')

        api 'org.eclipse.microprofile.config:microprofile-config-api:1.4'

        api('org.eclipse.microprofile.jwt:microprofile-jwt-auth-api') {
            because('CDI < 2.0')
            version {
                strictly('[1.1.1,2[')
                prefer('1.1.1')
            }
        }

        api('javax.security.enterprise:javax.security.enterprise-api:1.0')

        api('org.apache.commons:commons-lang3:3.11')

        // WebLogic https://docs.oracle.com/middleware/12213/wls/NOTES/whatsnew.htm#GUID-8C9B1C27-1275-4471-B7CD-4C75CC1D32FA__BGGGHCJD
        //
        api('javax.ws.rs:javax.ws.rs-api') {
            because('WebLogic 12.2.1.3')
            version {
                strictly('2.0.1')
            }
        }
        api('javax.enterprise:cdi-api') {
            because('WebLogic 12.2.1.3')
            version {
                strictly('[1.1, 1.2]')
                prefer('1.2')
            }
        }
        api('javax.servlet:javax.servlet-api') {
            because('WebLogic 12.2.1.3')
            version {
                strictly('3.1.0')
            }
        }
        api('javax.annotation:javax.annotation-api') {
            because('WebLogic 12.2.1.3')
            version {
                strictly('1.2')
            }
        }
        api('javax.ejb:javax.ejb-api') {
            because('WebLogic 12.2.1.3')
            version {
                strictly('[3.2, 3.3[')
                prefer('3.2.2')
            }
        }
        api('org.jboss.weld:weld-api') {
            because('WebLogic 12.2.1.3')
            version {
                strictly('2.3.Final')
            }
        }
        api('org.jboss.weld:weld-spi') {
            because('WebLogic 12.2.1.3')
            version {
                strictly('2.3.Final')
            }
        }
        api('com.google.guava:guava') {
            because('WebLogic 12.2.1.3')
            version {
                strictly('20.0')
            }
        }
        api('javax.security.jacc:javax.security.jacc-api') {
            because('WebLogic 12.2.1.3')
            version {
                strictly('1.5')
            }
        }
        api('javax.security.auth.message:javax.security.auth.message-api') {
            because('WebLogic 12.2.1.3')
            version {
                strictly('1.1')
            }
        }
        api('javax.json:javax.json-api:1.0') {
            because('WebLogic 12.2.1.3')
            version {
                strictly('1.0')
            }
        }
    }
}

publishing {
    publications {
        bom(MavenPublication) {
            from components.javaPlatform
        }
    }
}