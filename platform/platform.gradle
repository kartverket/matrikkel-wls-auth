plugins {
    id 'java-platform'
    id 'maven-publish'
}

dependencies {
    constraints {
        api('com.nimbusds:nimbus-jose-jwt:9.1.5')
        api('com.google.crypto.tink:tink:1.5.0')

        api 'org.bitbucket.b_c:jose4j:0.7.4'

        def arrowVersion = '0.11.0'
        api("io.arrow-kt:arrow-core:$arrowVersion")
        api("io.arrow-kt:arrow-fx:$arrowVersion")
        api("io.arrow-kt:arrow-fx-coroutines:$arrowVersion")
        api("io.arrow-kt:arrow-optics:$arrowVersion")
        api("io.arrow-kt:arrow-syntax:$arrowVersion")
        api("io.arrow-kt:arrow-meta:$arrowVersion")

        api('org.apache.logging.log4j:log4j-api:2.14.0')

        api 'org.eclipse.microprofile.config:microprofile-config-api:1.4'

        api('org.eclipse.microprofile.jwt:microprofile-jwt-auth-api') {
            because('CDI < 2.0')
            version {
                strictly('[1.1.1,2[')
                prefer('1.1.1')
            }
        }

        api('org.apache.commons:commons-lang3:3.11')

        // WebLogic https://docs.oracle.com/en/middleware/standalone/weblogic-server/14.1.1.0/notes/whatsnew.html#GUID-8C9B1C27-1275-4471-B7CD-4C75CC1D32FA__BGGGHCJD
        //
        api('jakarta.security.enterprise:jakarta.security.enterprise-api') {
            because('WebLogic 14.1.1.0')
            version {
                strictly('1.0.1')
            }
        }
        api('jakarta.ws.rs:jakarta.ws.rs-api') {
            because('WebLogic 14.1.1.0')
            version {
                strictly('2.1.5')
            }
        }
        api('jakarta.enterprise:jakarta.enterprise.cdi-api') {
            because('WebLogic 14.1.1.0')
            version {
                strictly('2.0.1')
            }
        }
        api('jakarta.servlet:jakarta.servlet-api') {
            because('WebLogic 14.1.1.0')
            version {
                strictly('4.0.2')
            }
        }
        api('jakarta.annotation:jakarta.annotation-api') {
            because('WebLogic 14.1.1.0')
            version {
                strictly('1.3.4')
            }
        }
        api('jakarta.ejb:jakarta.ejb-api') {
            because('WebLogic 14.1.1.0')
            version {
                strictly('3.2.5')
            }
        }
        api('org.jboss.weld:weld-api') {
            because('WebLogic 14.1.1.0')
            version {
                strictly('3.1.Final')
            }
        }
        api('org.jboss.weld:weld-spi') {
            because('WebLogic 14.1.1.0')
            version {
                strictly('3.1.Final')
            }
        }
        api('com.google.guava:guava') {
            because('WebLogic 14.1.1.0')
            version {
                strictly('27.0.1-jre')
            }
        }
        api('jakarta.security.jacc:jakarta.security.jacc-api') {
            because('WebLogic 14.1.1.0')
            version {
                strictly('1.6.1')
            }
        }
        api('jakarta.security.auth.message:jakarta.security.auth.message-api') {
            because('WebLogic 14.1.1.0')
            version {
                strictly('1.1.2')
            }
        }
        api('jakarta.json:jakarta.json-api') {
            because('WebLogic 14.1.1.0')
            version {
                strictly('1.1.5')
            }
        }
    }
}

publishing {
    publications {
        bom(MavenPublication) {
            from components.javaPlatform
        }
    }
}